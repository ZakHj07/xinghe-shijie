# 星河视界 · Netlify 部署配置
# 纯静态站点：仓库根目录就是站点根目录，没有构建步骤。

[build]
  publish = "."
  command = ""

# MediaPipe 的 wasm 必须是 application/wasm，否则浏览器拒绝实例化
[[headers]]
  for = "/vendor/mediapipe/wasm/*"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"

# 手势模型 7.5MB，长缓存，避免每次刷新都重下
[[headers]]
  for = "/vendor/mediapipe/*.task"
  [headers.values]
    Content-Type = "application/octet-stream"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# 代码与页面：每次都校验，避免改了代码还看到旧版
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"